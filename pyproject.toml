[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "worldcup2026"
version = "0.1.0"
description = "Probabilistic FIFA World Cup forecasting and tournament simulation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "World Cup Forecasting contributors"}]
keywords = ["football", "forecasting", "machine-learning", "world-cup", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "lxml>=6.0,<7",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "scikit-learn>=1.7,<2",
]

[project.optional-dependencies]
research = [
  "openpyxl>=3.1,<4",
  "scipy>=1.15,<2",
]
gpu = ["catboost>=1.2,<2", "lightgbm>=4.6,<5", "xgboost>=3.2,<4"]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py310"

[project.scripts]
worldcup2026 = "worldcup2026.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
